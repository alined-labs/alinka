# The checks the hub runs on MX3 before a merge, on GitHub: make check-py and
# make check-web, in replay mode with no secrets. Every action is pinned to a commit.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CACHE_MODE: replay # recorded model answers only; CI holds no keys

jobs:
  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      db:
        image: postgres:17-alpine # as in compose.yaml
        env:
          POSTGRES_USER: alinka
          POSTGRES_PASSWORD: alinka
          POSTGRES_DB: alinka
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U alinka -d alinka"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://alinka:alinka@localhost:5432/alinka
      ALINKA_REQUIRE_DB: "1" # the db tests fail instead of skipping
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tesseract (the OCR in docker/Dockerfile.api)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends \
            tesseract-ocr tesseract-ocr-spa tesseract-ocr-eng
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.13.1" # as in docker/Dockerfile.api
          enable-cache: true
      - run: make check-py

  web:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.11.2
          cache: true
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: make check-web
