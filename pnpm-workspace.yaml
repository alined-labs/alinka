# pnpm only (never npm, npx or yarn). The lockfile lives at the repo root.
packages:
  - web
  - edge
# Refuse package versions published in the last 3 days (minutes).
minimumReleaseAge: 4320
# Install scripts are blocked except for these (pnpm 11+ replaced onlyBuiltDependencies).
allowBuilds:
  esbuild: true
  workerd: true
